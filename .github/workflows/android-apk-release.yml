name: Build and publish Sulalah Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'native-android-source.zip'
      - '.github/workflows/android-apk-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract Android source
        run: unzip -q native-android-source.zip
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle --no-daemon -p native-android assembleDebug
      - name: Rename APK
        run: cp native-android/app/build/outputs/apk/debug/app-debug.apk native-android/Sulalah.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Sulalah Android v1.0.${{ github.run_number }}
          make_latest: true
          files: native-android/Sulalah.apk
